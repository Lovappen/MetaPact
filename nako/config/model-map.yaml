# model-map.yaml — 按能力的模型偏好表
#
# 安装器会：
# 1) 先读用户 openclaw.json 里模型条目声明的 capabilities/tags/features/modalities
# 2) 能力字段能命中时，直接按用户已配置模型顺序选择
# 3) 没有能力字段或能力字段不明确时，再参考下面 preferred 顺序
# 4) general 能力允许任意已配置文本模型兜底，避免新模型因为表未收录而安装失败
#
# 这个表不是支持列表，只是无能力字段时的偏好排序和已知好用模型提示。
#
# 能力含义：
# - roleplay: Nako 本体首选，要求中文对话稳定、角色扮演一致、能跟随工具指令。
# - general: 安装可用的最低文本能力，要求日常对话、总结、代码/配置分析可用。
# - vision: 可选图片理解能力，只影响 vision skill，不影响文字聊天和安装。

version: 1

capabilities:
  # agent 本体首选：需要角色扮演/对话优化
  roleplay:
    preferred:
      - sensenova/SenseChat-Character-Agt    # 商汤角色扮演专用
      - moonshot/kimi-k2.6
      - moonshot/kimi-k2.5
      - moonshot/kimi-k2-turbo
      - moonshot/kimi-k2-thinking-turbo
      - moonshot/kimi-k2-thinking
      - volcengine/kimi-k2-5-260127
      - zhipu/glm-4-plus
      - zai/glm-5
      - anthropic/claude-sonnet-4
      - openai/gpt-4o
    fallback_msg: |
      未发现角色扮演优化模型。将使用 general 能力。
      建议后续添加 sensenova/SenseChat-Character-Agt 以获得最佳角色一致性。

  # vision skill 依赖 primary 模型具备视觉
  vision:
    preferred:
      - anthropic/claude-sonnet-4
      - anthropic/claude-opus-4
      - openai/gpt-4o
      - google/gemini-2-pro
      - zai/glm-4v
    fallback_msg: |
      主模型不具备视觉能力。vision skill 能把图片路径交给 agent，
      但 agent 看不见图片内容。建议换一个多模态模型作 primary。

  # 日常通用：指令跟随、代码、总结
  general:
    preferred:
      - moonshot/kimi-k2.6
      - volcengine-plan/ark-code-latest
      - volcengine/deepseek-v3-2-251201
      - volcengine/doubao-seed-1-8-251228
      - volcengine/doubao-seed-code-preview-251028
      - volcengine/glm-4-7-251222
      - volcengine/kimi-k2-5-260127
      - moonshot/kimi-k2-thinking-turbo
      - moonshot/kimi-k2-thinking
      - moonshot/kimi-k2-turbo
      - moonshot/kimi-k2.5
      - zai/glm-4.7
      - zai/glm-5
      - anthropic/claude-sonnet-4
      - openai/gpt-4o
      - zhipu/glm-4-plus

# agent 级偏好
agents:
  agent-nako:
    capabilities: [roleplay]
    fallback_to: general

# skill 级依赖
skills:
  vision:
    needs_capabilities: [vision]
    needs_bins: []
    needs_env: []
  hearing:
    needs_capabilities: []
    needs_bins: [whisper, ffmpeg]
    needs_env: []
    note: "首次运行会下 whisper 模型（~72MB for tiny, ~1.5GB for turbo）"
  voice:
    needs_capabilities: []
    needs_bins: [jq, curl, xxd, uuidgen, ffprobe]
    needs_env: [FEISHU_APP_ID, FEISHU_APP_SECRET]
    needs_any_env:
      - [MINIMAX_API_KEY, MINIMAX_GROUP_ID]   # 能唱歌必须国内 MiniMax
      - [VOLCENGINE_API_KEY]                   # 仅能说话（不能唱歌）
  selfie:
    needs_capabilities: []
    needs_bins: [jq, curl]
    needs_env: [FEISHU_APP_ID, FEISHU_APP_SECRET]
    needs_any_env:
      - [FAL_KEY]
      - [KIE_API_KEY]
  dokidoki:
    needs_capabilities: []
    needs_bins: [doki]
    needs_env: []
    note: "npm install -g @tryjoy/dokidoki 取得 doki"
